<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Particle Morphing System</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* SCI-FI UI STYLING */
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg: #020205;
            --panel-bg: rgba(10, 15, 20, 0.85);
        }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Background Grid */
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        /* Camera Feed (HUD Style) */
        #video-container {
            position: fixed; right: 20px; bottom: 20px; width: 240px; height: 180px;
            border: 1px solid var(--primary);
            background: rgba(0,0,0,0.5);
            z-index: 10;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        #video-container::before {
            content: "OPTICAL_SENSOR_01";
            position: absolute; top: 5px; left: 10px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--primary);
            z-index: 12;
        }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.6; }

        /* Main UI Panel */
        #ui {
            position: fixed; top: 30px; left: 30px;
            width: 300px;
            background: var(--panel-bg);
            border-left: 4px solid var(--primary);
            padding: 20px;
            color: white;
            z-index: 10;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            clip-path: polygon(0 0, 100% 0, 100% 95%, 90% 100%, 0 100%);
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #aaa; }
        .data-val { color: white; }
        .status-active { color: #0f0; }
        .status-idle { color: #ffaa00; }
        
        .instructions {
            margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px; color: var(--primary);
        }

        /* Start Button */
        #overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #startBtn {
            padding: 15px 40px; background: transparent; color: var(--primary);
            border: 2px solid var(--primary); font-family: 'Share Tech Mono', monospace;
            font-size: 18px; cursor: pointer; letter-spacing: 3px;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        #startBtn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }
        .loader { margin-top: 20px; font-family: 'Share Tech Mono'; color: #666; font-size: 12px; }

    </style>
</head>
<body>

<div class="grid-bg"></div>

<div id="overlay">
    <button id="startBtn">INITIALIZE SYSTEM</button>
    <div class="loader" id="loadingText">Awaiting User Input...</div>
</div>

<div id="ui">
    <h1>Particle Core</h1>
    <div class="data-row"><span>STATUS:</span> <span id="sysStatus" class="data-val status-idle">STANDBY</span></div>
    <div class="data-row"><span>MODE:</span> <span id="modeVal" class="data-val">---</span></div>
    <div class="data-row"><span>PARTICLES:</span> <span class="data-val">15,000</span></div>
    <div class="data-row"><span>EXPANSION:</span> <span id="expVal" class="data-val">100%</span></div>
    
    <div class="instructions">
        👌 PINCH: Next Configuration<br>
        🖐 OPEN HAND: Expand Field<br>
        👋 MOVE HAND: Rotate View
    </div>
</div>

<div id="video-container">
    <video id="video" autoplay muted playsinline></video>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* ----------------------------------------------------------------
   SYSTEM CONFIGURATION
---------------------------------------------------------------- */
const CONFIG = {
    particleCount: 15000,
    particleSize: 0.25,
    lerpSpeed: 0.08, // Movement smoothness (lower = smoother/slower)
    handSmoothing: 0.1 // Hand tracking smoothness
};

// Global State
let isSystemActive = false;
let currentShape = 'DNA';
let isPinching = false;
let pinchCooldown = false;

/* ----------------------------------------------------------------
   1. THREE.JS SCENE SETUP
---------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020205, 0.02);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 35;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance optimization
document.body.appendChild(renderer.domElement);

/* ----------------------------------------------------------------
   2. PARTICLE SYSTEM GENERATION
---------------------------------------------------------------- */
// Generate a soft glow texture programmatically
function getTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.2, 'rgba(240,240,240,0.8)');
    grad.addColorStop(0.5, 'rgba(240,240,240,0.2)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const texture = new THREE.Texture(canvas);
    texture.needsUpdate = true;
    return texture;
}

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(CONFIG.particleCount * 3);
const targets = new Float32Array(CONFIG.particleCount * 3); // The "Goal" positions
const colors = new Float32Array(CONFIG.particleCount * 3);

// Initial random scatter
for(let i=0; i<CONFIG.particleCount * 3; i++) {
    positions[i] = (Math.random() - 0.5) * 100;
    targets[i] = positions[i];
    colors[i] = 1;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
    size: CONFIG.particleSize,
    map: getTexture(),
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

/* ----------------------------------------------------------------
   3. SHAPE ALGORITHMS (SCIENTIFIC THEME)
---------------------------------------------------------------- */
const shapeGenerators = {
    DNA: (i, count) => {
        const t = i / count * 10 * Math.PI;
        const radius = 6;
        // Double Helix Structure
        const offset = i % 2 === 0 ? 0 : Math.PI;
        const x = Math.cos(t + offset) * radius;
        const z = Math.sin(t + offset) * radius;
        const y = (i / count - 0.5) * 40;
        return { x, y, z, r: 0.2, g: 0.8, b: 1 }; // Cyan/Green
    },
    SPHERE: (i, count) => {
        const phi = Math.acos(-1 + (2 * i) / count);
        const theta = Math.sqrt(count * Math.PI) * phi;
        const r = 12;
        return {
            x: r * Math.sin(phi) * Math.cos(theta),
            y: r * Math.sin(phi) * Math.sin(theta),
            z: r * Math.cos(phi),
            r: 1, g: 0.4, b: 0.1 // Orange
        };
    },
    CUBE: (i, count) => {
        const s = 18; // size
        const amount = Math.cbrt(count);
        const x = (i % amount) * (s/amount) - s/2;
        const y = (Math.floor(i/amount) % amount) * (s/amount) - s/2;
        const z = (Math.floor(i/(amount*amount))) * (s/amount) - s/2;
        return { x, y, z, r: 0.8, g: 0.1, b: 0.8 }; // Purple
    },
    GALAXY: (i, count) => {
        const armCount = 3;
        const spin = i / count * armCount * Math.PI * 2;
        const radius = (i / count) * 20;
        const x = Math.cos(spin) * radius;
        const z = Math.sin(spin) * radius;
        const y = (Math.random() - 0.5) * (20 - radius) * 0.5;
        return { x, y, z, r: 0.1, g: 0.5, b: 1 }; // Blue
    }
};

function morphTo(shapeName) {
    const generator = shapeGenerators[shapeName];
    currentShape = shapeName;
    document.getElementById('modeVal').innerText = shapeName;
    
    // Update Target Array (Not the render array)
    for(let i=0; i<CONFIG.particleCount; i++) {
        const data = generator(i, CONFIG.particleCount);
        targets[i*3] = data.x;
        targets[i*3+1] = data.y;
        targets[i*3+2] = data.z;
        colors[i*3] = data.r;
        colors[i*3+1] = data.g;
        colors[i*3+2] = data.b;
    }
    geometry.attributes.color.needsUpdate = true;
}

const shapeKeys = Object.keys(shapeGenerators);
let shapeIndex = 0;
morphTo('DNA');

/* ----------------------------------------------------------------
   4. HAND TRACKING ENGINE
---------------------------------------------------------------- */
const video = document.getElementById("video");
const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

// Physics Variables
let handExpansion = 1.0;
let targetExpansion = 1.0;
let handRotX = 0, handRotY = 0;
let targetRotX = 0, targetRotY = 0;

hands.onResults((results) => {
    const sysStatus = document.getElementById("sysStatus");
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        sysStatus.innerText = "TRACKING ACTIVE";
        sysStatus.className = "data-val status-active";
        
        const lm = results.multiHandLandmarks[0];
        
        // 1. PINCH DETECTION (Thumb tip 4 to Index tip 8)
        const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
        
        if (pinchDist < 0.05) {
            if (!isPinching && !pinchCooldown) {
                isPinching = true;
                pinchCooldown = true;
                
                // Trigger Shape Swap
                shapeIndex = (shapeIndex + 1) % shapeKeys.length;
                morphTo(shapeKeys[shapeIndex]);
                
                // Visual Pulse
                scene.background = new THREE.Color(0x111111);
                setTimeout(() => scene.background = null, 100);

                setTimeout(() => { pinchCooldown = false; }, 1000); // 1 sec cooldown
            }
        } else {
            isPinching = false;
        }

        // 2. EXPANSION (Index 8 to Pinky 20)
        const spread = Math.hypot(lm[8].x - lm[20].x, lm[8].y - lm[20].y);
        // Map spread 0.1->0.3 to scale 1.0->2.5
        targetExpansion = THREE.MathUtils.mapLinear(spread, 0.05, 0.3, 0.8, 3.0);
        
        // 3. ROTATION (Using Wrist 0 and Middle Finger 9)
        targetRotY = (lm[9].x - 0.5) * 3; // Left/Right
        targetRotX = (lm[9].y - 0.5) * 3; // Up/Down

    } else {
        sysStatus.innerText = "SEARCHING...";
        sysStatus.className = "data-val status-idle";
        // Reset if no hand
        targetExpansion = 1.0;
        targetRotX = 0; 
        targetRotY = 0;
    }
});

/* ----------------------------------------------------------------
   5. INITIALIZATION & LOOP
---------------------------------------------------------------- */
const cam = new Camera(video, {
    onFrame: async () => { await hands.send({image: video}); },
    width: 640,
    height: 480
});

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('loadingText').innerText = "Starting Optical Sensors...";
    document.getElementById('startBtn').style.display = 'none';
    
    cam.start().then(() => {
        document.getElementById('overlay').style.display = 'none';
        isSystemActive = true;
    }).catch(err => {
        document.getElementById('loadingText').innerText = "Error accessing camera. Allow permissions.";
    });
});

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    // Smooth Interpolation for Hand Values
    handExpansion += (targetExpansion - handExpansion) * CONFIG.handSmoothing;
    handRotX += (targetRotX - handRotX) * CONFIG.handSmoothing;
    handRotY += (targetRotY - handRotY) * CONFIG.handSmoothing;

    // Update UI
    document.getElementById('expVal').innerText = Math.round(handExpansion * 100) + "%";

    // Rotate Entire System
    particles.rotation.y = handRotY + (time * 0.05); // Add slight auto-rotation
    particles.rotation.x = handRotX;

    // Particle Logic
    const pos = geometry.attributes.position.array;
    
    for(let i=0; i<CONFIG.particleCount; i++) {
        const ix = i * 3;
        const iy = i * 3 + 1;
        const iz = i * 3 + 2;

        // Calculate Target Position based on Shape + Expansion
        // We apply expansion to the target, not the current position, to prevent drift
        const tx = targets[ix] * handExpansion;
        const ty = targets[iy] * handExpansion;
        const tz = targets[iz] * handExpansion;

        // Add subtle "breathing" noise
        const noise = Math.sin(time * 2 + i) * 0.05;

        // Move current position towards target position (Lerp)
        pos[ix] += (tx - pos[ix] + noise) * CONFIG.lerpSpeed;
        pos[iy] += (ty - pos[iy] + noise) * CONFIG.lerpSpeed;
        pos[iz] += (tz - pos[iz]) * CONFIG.lerpSpeed;
    }

    geometry.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}

animate();

// Handle Window Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
